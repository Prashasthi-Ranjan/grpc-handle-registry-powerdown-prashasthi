lower_page:
  size: 128
  fields:
    identifier: { offset: 0, type: uint8, format: "0x%02x lower-case" }
    flat_mem: { offset: 2, type: bit, bit: 7, note: "bit7 1=flat 0=paged per 8.2.3" }
    module_state: { offset: 3, type: bits, bits: "3:1", note: "bits 3:1 ModuleState per 8.2.4" }
    media_type: { offset: 85, type: uint8 }
    media_interface: { offset: 86, type: uint8 }

page_00h:
  size: 128
  fields:
    vendor_name: { offset: 1, length: 16, type: ascii, trim: "trailing spaces 0x20 and nulls 0x00 ONLY" }
    vendor_oui: { offset: 17, length: 3, type: bytes, format: "xx:xx:xx uppercase colon" }
    vendor_pn: { offset: 20, length: 16, type: ascii, trim: "trailing only" }
    vendor_sn: { offset: 36, length: 16, type: ascii, trim: "trailing only" }
    power_byte: { offset: 72, type: uint8, note: "bits7:5 PowerClass raw 0..7 +1 => 1..8, bits4:0 MaxPower raw 0..31 *100 mW" }

page_01h:
  size: 128
  fields:
    host_lane_count: { offset: 14, type: uint8, validation: "0..8 else error" }
    media_lane_count: { offset: 15, type: uint8, validation: "0..8 else error" }
    host_assignment_mask: { offset: 20, type: bitmask, note: "sorted asc 0..7, empty 0x00 -> [] non-nil new backing" }
    media_assignment_mask: { offset: 21, type: bitmask }
    supported_pages_mask: { offset: 22, type: bitmask, note: "bits0..6 =10h,11h,12h,14h,20h,16h,04h bit7 reserved ignore" }
    cdb_mask: { offset: 23, type: bitmask, note: "bit0 cdb_supported, bits1-2 bgInstances, bit3 fullPageRead" }
    duration_byte: { offset: 39, type: uint8, note: "low nibble PwrUp high nibble PwrDn Table 8-48" }
